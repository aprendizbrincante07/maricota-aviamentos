  <script>
    function mostrarCarrinho() {
      const carrinho = getCarrinho();
      const lista = document.getElementById("lista-carrinho");
      const totalEl = document.getElementById("total-carrinho");

      if (carrinho.length === 0) {
        lista.innerHTML = "<p>Seu carrinho está vazio.</p>";
        totalEl.textContent = "";
        return;
      }

      let html = "";
      let total = 0;

      carrinho.forEach(function (item, indice) {
  const foto = item.imagem
    ? "<img src='" + item.imagem + "' alt='" + item.nome + "' class='foto-carrinho'>"
    : "";
  html += "<div class='item-carrinho'>" +
            foto +
            "<span class='nome-carrinho'>" + item.nome + " - R$ " + item.preco.toFixed(2) + "</span>" +
            "<button onclick='removerDoCarrinho(" + indice + "); mostrarCarrinho();'>Remover</button>" +
          "</div>";
  total += item.preco;
});

      lista.innerHTML = html;
      totalEl.textContent = "Total: R$ " + total.toFixed(2);
    }

    document.addEventListener("DOMContentLoaded", mostrarCarrinho);
  </script>
